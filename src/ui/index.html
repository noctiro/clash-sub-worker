<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>__PROFILE_NAME__</title>
    <style nonce="__CSP_NONCE__">
      :root{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light dark;--bg:#0d1219;--panel:#141b24;--item:#1a2430;--item-hover:#202c3a;--text:#f2f5f8;--muted:#8e9aa8;--line:#293645;--accent:#7ba2ff;--accent-bg:#182b4d;--primary:#5f8cff;--primary-hover:#76a0ff;--danger:#ff817a;--danger-bg:#321d20}
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
      button,a,.option{touch-action:manipulation}
      main{width:min(640px,calc(100% - 32px));margin:auto;padding:clamp(32px,7vh,64px) 0}
      .page-header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:0 2px 16px}
      h1{margin:0;overflow-wrap:anywhere;font-size:clamp(1.45rem,4vw,1.8rem);line-height:1.25;letter-spacing:-.03em}
      .panel{padding:22px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
      .reset{flex:none;border:0;background:transparent;color:var(--accent);padding:7px 3px;font:inherit;font-size:.77rem;font-weight:650;cursor:pointer}
      .reset:hover{text-decoration:underline;text-underline-offset:3px}
      .reset:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:5px}
      .reset[hidden]{display:none}
      .tag-group+.tag-group{margin-top:20px;padding-top:19px;border-top:1px solid var(--line)}
      .group-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:11px}
      h2{margin:0;font-size:.9rem}
      .group-heading span{color:var(--muted);font-size:.72rem}
      .options{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
      .option{position:relative;cursor:pointer}
      .option input{position:absolute;width:1px;height:1px;opacity:0}
      .option span{display:flex;align-items:center;gap:9px;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--item);font-size:.82rem}
      .option span::before{content:"";width:14px;height:14px;flex:none;border:1px solid var(--muted);border-radius:4px}
      .option input[type="radio"]+span::before{border-radius:50%}
      .option:hover span{background:var(--item-hover)}
      .option input:checked+span{border-color:var(--accent);background:var(--accent-bg)}
      .option input[type="checkbox"]:checked+span::before{content:"✓";display:grid;place-items:center;border-color:var(--accent);background:var(--accent);color:#08111f;font-size:.68rem;font-weight:800}
      .option input[type="radio"]:checked+span::before{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--accent-bg)}
      .option input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
      .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
      .actions>a,.actions>button{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid var(--line);border-radius:9px;background:var(--item);color:var(--text);padding:8px 10px;font:inherit;font-size:.81rem;font-weight:650;text-align:center;text-decoration:none;cursor:pointer}
      .actions>a:hover,.actions>button:hover{background:var(--item-hover)}
      .actions>a:focus-visible,.actions>button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
      .actions>.primary{border-color:var(--primary);background:var(--primary);color:#fff}
      .actions>.primary:hover{border-color:var(--primary-hover);background:var(--primary-hover)}
      .qr-panel{margin-top:12px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--item);text-align:center}
      .qr-panel[hidden]{display:none}
      .qr-code{display:block;max-width:100%;height:auto;margin:auto;border:8px solid #fff;border-radius:8px;background:#fff;image-rendering:pixelated}
      #status{margin:12px 0 0;padding:8px 10px;border-radius:8px;background:var(--danger-bg);color:var(--danger);font-size:.76rem;text-align:center}
      #status:empty{display:none}
      .copy-buffer{position:fixed;bottom:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none}
      @media(prefers-color-scheme:light){:root{--bg:#f5f7fa;--panel:#fff;--item:#f4f6f8;--item-hover:#ebeff3;--text:#182131;--muted:#687486;--line:#dbe1e8;--accent:#356ee8;--accent-bg:#edf3ff;--primary:#316be5;--primary-hover:#255bc9;--danger:#c43d3d;--danger-bg:#fff0f0}}
      @media(max-width:520px){main{width:min(100% - 20px,640px);padding:24px 0}.panel{padding:17px}.options{grid-template-columns:repeat(2,minmax(0,1fr))}.qr-panel{padding:13px}}
    </style>
  </head>
  <body>
    <main>
      <header class="page-header">
        <h1>__PROFILE_NAME__</h1>
        <button id="reset" class="reset" type="button" hidden>重置</button>
      </header>
      <section class="panel" aria-label="订阅设置">
        <!--TAG_OPTIONS-->
        <div class="actions">
          <button id="import" class="primary" type="button">导入 Clash</button>
          <button id="qr-toggle" type="button" aria-controls="qr-panel" aria-expanded="false">二维码</button>
          <button id="copy" type="button">复制链接</button>
          <a id="download" href="#" download>下载 YAML</a>
        </div>
        <section id="qr-panel" class="qr-panel" aria-label="订阅二维码" hidden>
          <canvas id="qr-code" class="qr-code" role="img" aria-label="当前订阅链接的二维码"></canvas>
        </section>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script nonce="__CSP_NONCE__">
      (() => {
        "use strict";
        <!--QR_CODE_LIBRARY-->
        const params = new URLSearchParams(location.search);
        const token = params.get("token");
        const controls = [...document.querySelectorAll(".tag-control")];
        const download = document.getElementById("download");
        const copy = document.getElementById("copy");
        const reset = document.getElementById("reset");
        const qrToggle = document.getElementById("qr-toggle");
        const qrPanel = document.getElementById("qr-panel");
        const qrCanvas = document.getElementById("qr-code");
        const status = document.getElementById("status");
        let renderedQrValue = "";
        let copyTimer;
        const initialTags = new Set(
          params.getAll("tag").flatMap((value) => value.split(",")).map((value) => value.trim()).filter(Boolean),
        );

        function tagValue(control) {
          return control.getAttribute("value") || "";
        }

        for (const control of controls) {
          const value = tagValue(control);
          if (value && initialTags.has(value)) control.checked = true;
        }

        function buildUrl() {
          const url = new URL(location.href);
          url.search = "";
          if (token) url.searchParams.set("token", token);
          url.searchParams.set("format", "yaml");
          for (const control of controls) {
            const value = tagValue(control);
            if (control.checked && value) url.searchParams.append("tag", value);
          }
          return url.href;
        }

        function selectedValues() {
          return controls.filter((control) => control.checked).map(tagValue).filter(Boolean);
        }

        function syncAddress(values) {
          const url = new URL(location.href);
          url.search = "";
          if (token) url.searchParams.set("token", token);
          url.searchParams.set("format", "html");
          for (const value of values) url.searchParams.append("tag", value);
          history.replaceState(null, "", url);
        }

        function setStatus(message) {
          status.textContent = message;
        }

        function renderQr(value) {
          if (renderedQrValue === value) return;
          const code = generateQr(value, { minCorrectionLevel: 1 });
          code.toCanvas(qrCanvas);
          const pixelSize = code.size + 8;
          const scale = Math.max(1, Math.floor(250 / pixelSize));
          qrCanvas.style.width = String(pixelSize * scale) + "px";
          renderedQrValue = value;
        }

        function update(sync) {
          const values = selectedValues();
          const url = buildUrl();
          download.href = url;
          reset.hidden = values.length === 0;
          if (sync) syncAddress(values);
          clearTimeout(copyTimer);
          copy.textContent = "复制链接";
          setStatus("");
          if (!qrPanel.hidden) {
            try {
              renderQr(url);
            } catch {
              qrPanel.hidden = true;
              qrToggle.setAttribute("aria-expanded", "false");
              qrToggle.textContent = "二维码";
              setStatus("二维码生成失败，请复制链接");
            }
          }
        }

        function fallbackCopy(value) {
          const buffer = document.createElement("textarea");
          buffer.className = "copy-buffer";
          buffer.value = value;
          buffer.setAttribute("readonly", "");
          document.body.append(buffer);
          buffer.select();
          const copied = document.execCommand("copy");
          buffer.remove();
          if (!copied) throw new Error("Copy failed");
        }

        async function copyUrl(value) {
          try {
            if (!navigator.clipboard) throw new Error("Clipboard unavailable");
            await navigator.clipboard.writeText(value);
          } catch {
            fallbackCopy(value);
          }
        }

        for (const control of controls) control.addEventListener("change", () => update(true));
        reset.addEventListener("click", () => {
          for (const control of controls) control.checked = !tagValue(control);
          update(true);
        });
        document.getElementById("import").addEventListener("click", () => {
          location.href = "clash://install-config?url=" + encodeURIComponent(buildUrl());
        });
        copy.addEventListener("click", async () => {
          try {
            await copyUrl(buildUrl());
            clearTimeout(copyTimer);
            copy.textContent = "已复制";
            copyTimer = setTimeout(() => { copy.textContent = "复制链接"; }, 1600);
          } catch {
            setStatus("复制失败，请使用下载或二维码");
          }
        });
        qrToggle.addEventListener("click", () => {
          const show = qrPanel.hidden;
          if (show) {
            try {
              renderQr(buildUrl());
            } catch {
              setStatus("二维码生成失败，请复制链接");
              return;
            }
          }
          qrPanel.hidden = !show;
          qrToggle.setAttribute("aria-expanded", String(show));
          qrToggle.textContent = show ? "收起" : "二维码";
          setStatus("");
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !qrPanel.hidden) qrToggle.click();
        });
        update(false);
      })();
    </script>
  </body>
</html>
